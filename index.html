html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #0b0e16; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
#status, #status-splash { top: 0; bottom: 0; }
#status { background-color: #ebebf4; display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; }
#status-splash { max-height: 100%; max-width: 100%; margin: auto; }
#status-splash.show-image--false { display: none; }
#status-splash.fullsize--true { height: 100%; width: 100%; object-fit: contain; }
#status-splash.use-filter--false { image-rendering: pixelated; }
#status-progress, #status-notice { display: none; }
#status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
#status-notice { background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0; font-family: system-ui, sans-serif; line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center; z-index: 1; }

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">

			<div id="status-notice"></div>

		<script src="index.js"></script>
		<script>
// ---------------------------------------------------------------------------
// weBump approval relay.
//
// The game (scripts/webump_api.gd) calls window.webumpOpenApproval(appUrl, pageUrl)
// and then polls the API for the result itself. The message listener below is a
// fallback for a callback page that posts {type, code, state, error} to its opener.
// ---------------------------------------------------------------------------
const APPROVAL_ORIGIN = 'https://webump.app';
const HOST_ORIGIN = 'https://webump.app'; // The page allowed to embed this game.
let approvalWindow = null;
// On an iPhone the app link opens weBump directly and the game keeps polling in this
// tab; elsewhere the approval page opens in a popup and shows a QR code.
window.webumpOpenApproval = function (appUrl, pageUrl) {
	const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
		(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	if (isIOS && appUrl) {
		// Safari blocks custom-scheme navigation from a cross-origin frame. At top level,
		// open the app directly; embedded by our own host page, ask it to; embedded
		// anywhere else (itch.io, portals), fall back to the approval page, which
		// shows an Open weBump button of its own.
		const embedded = window.parent !== window;
		const parentOrigin = window.location.ancestorOrigins ? window.location.ancestorOrigins[0] : '';
		if (!embedded) {
			window.location.href = appUrl;
			return true;
		}
		if (parentOrigin === HOST_ORIGIN) {
			window.parent.postMessage({ type: 'webump-open-app', url: appUrl }, HOST_ORIGIN);
			return true;
		}
	}
	approvalWindow = window.open(pageUrl, 'webump-approval', 'popup,width=520,height=780');
	if (!approvalWindow) {
		approvalWindow = window.open(pageUrl, '_blank'); // Popup blocked: fall back to a tab.
	}
	return Boolean(approvalWindow);
};
window.addEventListener('message', (event) => {
	if (event.origin !== APPROVAL_ORIGIN || !event.data || event.data.type !== 'webump-callback') return;
	if (approvalWindow && event.source !== approvalWindow) return;
	if (typeof window.webumpDeliverCallback === 'function') {
		window.webumpDeliverCallback(JSON.stringify({
			code: event.data.code || '', state: event.data.state || '', error: event.data.error || '',
		}));
	}
});

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1994232,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';
	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') { statusOverlay.remove(); initializing = false; return; }
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}
	function displayFailureNotice(err) {
		console.error(err);
		statusNotice.textContent = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing features needed to run the demo:\n' + missing.join('\n'));
		return;
	}
	setStatusMode('progress');
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) { statusProgress.value = current; statusProgress.max = total; }
			else { statusProgress.removeAttribute('value'); statusProgress.removeAttribute('max'); }
		},
	}).then(() => setStatusMode('hidden'), displayFailureNotice);
}());
		</script>
	</body>
