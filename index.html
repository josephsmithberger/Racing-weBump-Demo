<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Starter Kit Racing</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #0b0e16; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
#status, #status-splash { top: 0; bottom: 0; }
#status { background-color: #ebebf4; display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; }
#status-splash { max-height: 100%; max-width: 100%; margin: auto; }
#status-splash.show-image--false { display: none; }
#status-splash.fullsize--true { height: 100%; width: 100%; object-fit: contain; }
#status-splash.use-filter--false { image-rendering: pixelated; }
#status-progress, #status-notice { display: none; }
#status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
#status-notice { background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0; font-family: system-ui, sans-serif; line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center; z-index: 1; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>
		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<script src="index.js"></script>
		<script>
// ---------------------------------------------------------------------------
// Frame cap.
//
// A 120 Hz iPhone hands the engine twice the frames it needs, which is twice the
// battery and heat for a race that reads the same at 60. Godot's own max_fps
// cannot do this here: it caps by sleeping, and in a single-threaded web build
// that sleep compiles to a busy-wait, so the tab holds a core at 100% for the
// half of each frame it is trying to idle. Skipping animation frames instead
// leaves the main thread genuinely free, and no-ops on a 60 Hz display.
// ---------------------------------------------------------------------------
(function () {
	const TARGET_MS = 1000 / 60;
	const raf = window.requestAnimationFrame.bind(window);
	const caf = window.cancelAnimationFrame.bind(window);
	// The display's own interval, measured as the shortest gap seen so far. A vsync
	// is let through once skipping it would overshoot 60 Hz by more than half a
	// refresh, which keeps 60 Hz displays untouched and 120 Hz ones at every second.
	let refreshMs = TARGET_MS;
	let previousTs = 0;
	let renderedTs = -Infinity;
	// Every callback scheduled for the same vsync gets the same timestamp, so the
	// decision is made once per vsync and reused. Deciding per callback instead
	// would let two callers take turns claiming the frame and halve each one's rate.
	let decidedTs = NaN;
	let decision = true;
	function letThrough(timestamp) {
		if (timestamp === decidedTs) return decision;
		decidedTs = timestamp;
		if (previousTs) {
			const gap = timestamp - previousTs;
			if (gap > 1 && gap < refreshMs) refreshMs = gap;
		}
		previousTs = timestamp;
		decision = timestamp - renderedTs >= TARGET_MS - refreshMs / 2;
		if (decision) renderedTs = timestamp;
		return decision;
	}
	let nextHandle = 1;
	const pending = new Map(); // Our handle -> the browser's current handle.
	window.requestAnimationFrame = function (callback) {
		const handle = nextHandle++;
		const step = function (timestamp) {
			if (!letThrough(timestamp)) {
				pending.set(handle, raf(step));
				return;
			}
			pending.delete(handle);
			callback(timestamp);
		};
		pending.set(handle, raf(step));
		return handle;
	};
	window.cancelAnimationFrame = function (handle) {
		const browserHandle = pending.get(handle);
		if (browserHandle === undefined) return;
		pending.delete(handle);
		caf(browserHandle);
	};
}());

// ---------------------------------------------------------------------------
// weBump approval relay.
//
// The game (scripts/webump_api.gd) calls window.webumpOpenApproval(appUrl, pageUrl)
// for the device flow. Hosted connections use the shared SDK on the callback
// origin; the legacy popup listener is retained for explicit visitor handoffs.
// ---------------------------------------------------------------------------
const APPROVAL_ORIGIN = 'https://webump.app';
const HOST_ORIGIN = 'https://webump.app'; // The page allowed to embed this game.
let approvalWindow = null;
// On an iPhone the app link opens weBump directly and the game keeps polling in this
// tab; elsewhere the approval page opens in a popup and shows a QR code.
// Called only when the player is already on the iPhone running weBump: hand the
// approval straight to the app. Every other device shows a QR code inside the game
// instead, so nothing here depends on a popup the browser may block.
// The SDK on the trusted host selects same-phone callbacks or cross-device approval.
window.webumpHostedConnectionReady = false;
window.webumpConnect = id => window.parent.postMessage({type:'webump-connect',id}, HOST_ORIGIN);
window.webumpCancelConnection = id => window.parent.postMessage({type:'webump-cancel',id}, HOST_ORIGIN);
window.addEventListener('message', event => {
	if (event.origin !== HOST_ORIGIN || event.source !== window.parent || window.parent === window) return;
	if (event.data?.type === 'webump-host-ready') window.webumpHostedConnectionReady = true;
	if (['webump-connection-prompt','webump-connection-result','webump-connection-error'].includes(event.data?.type)
		&& typeof window.webumpDeliverConnection === 'function') {
		window.webumpDeliverConnection(JSON.stringify(event.data));
	}
});
if (window.parent !== window) window.parent.postMessage({type:'webump-frame-ready'}, HOST_ORIGIN);
window.webumpOpenApproval = function (appUrl, pageUrl) {
	if (!appUrl) { window.open(pageUrl, '_blank', 'noopener'); return true; }
	const embedded = window.parent !== window;
	const parentOrigin = window.location.ancestorOrigins ? window.location.ancestorOrigins[0] : '';
	if (!embedded) {
		window.location.href = appUrl || pageUrl;
		return true;
	}
	// Safari blocks custom-scheme navigation from a cross-origin frame, so our own
	// host page opens it from the top level.
	if (parentOrigin === HOST_ORIGIN) {
		window.parent.postMessage({ type: 'webump-open-app', url: appUrl }, HOST_ORIGIN);
		return true;
	}
	approvalWindow = window.open(pageUrl, 'webump-approval', 'popup,width=520,height=780');
	return Boolean(approvalWindow);
};
window.addEventListener('message', (event) => {
	if (event.origin !== APPROVAL_ORIGIN || !event.data || event.data.type !== 'webump-callback') return;
	if (!approvalWindow || event.source !== approvalWindow) return;
	if (typeof window.webumpDeliverCallback === 'function') {
		window.webumpDeliverCallback(JSON.stringify({
			code: event.data.code || '', state: event.data.state || '', error: event.data.error || '',
		}));
	}
});

// Revalidate the small game pack so a cached export cannot keep an old Connect flow.
// The large engine/WASM files keep their normal caching behavior.
const gameFetch = window.fetch.bind(window);
window.fetch = (input, options) => {
	if (typeof input === 'string') {
		const url = new URL(input, window.location.href);
		if (url.origin === window.location.origin && url.pathname.endsWith('/index.pck')) {
			options = { ...options, cache: 'no-cache' };
		}
	}
	return gameFetch(input, options);
};

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2006396,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';
	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') { statusOverlay.remove(); initializing = false; return; }
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}
	function displayFailureNotice(err) {
		console.error(err);
		statusNotice.textContent = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing features needed to run the demo:\n' + missing.join('\n'));
		return;
	}
	setStatusMode('progress');
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) { statusProgress.value = current; statusProgress.max = total; }
			else { statusProgress.removeAttribute('value'); statusProgress.removeAttribute('max'); }
		},
	}).then(() => setStatusMode('hidden'), displayFailureNotice);
}());
		</script>
	</body>
</html>
